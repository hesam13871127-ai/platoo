services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: vibetable
      MYSQL_USER: vibetable
      MYSQL_PASSWORD: vibetable
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - vibetable_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/001_admin_panel.sql:/docker-entrypoint-initdb.d/02-admin-panel.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - vibetable_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: vibetable
      DB_PASSWORD: vibetable
      DB_NAME: vibetable
      JWT_ACCESS_SECRET: replace-with-a-64-character-random-secret
      JWT_REFRESH_SECRET: replace-with-a-different-64-character-random-secret
      DEV_OTP_ENABLED: "true"
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  vibetable_mysql:
  vibetable_redis:
